<!DOCTYPE html>
<html>
	<head>
		<script>
			performance.mark('code/didStartRenderer');
		</script>
		<meta charset="utf-8" />

		<!-- Mobile tweaks -->
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Code">
		<link rel="apple-touch-icon" href="{{WORKBENCH_WEB_BASE_URL}}/resources/server/code-192.png" />

		<!-- Disable pinch zooming -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">

		<!-- Workbench Configuration -->
		<meta id="vscode-workbench-web-configuration" data-settings="{{WORKBENCH_WEB_CONFIGURATION}}">

		<!-- Workbench Auth Session -->
		<meta id="vscode-workbench-auth-session" data-settings="{{WORKBENCH_AUTH_SESSION}}">

		<!-- Workbench Icon/Manifest/CSS -->
		<link rel="icon" href="{{WORKBENCH_WEB_BASE_URL}}/resources/server/favicon.ico" type="image/x-icon" />
		<link rel="manifest" href="{{WORKBENCH_WEB_BASE_URL}}/resources/server/manifest.json" crossorigin="use-credentials" />
		<link rel="stylesheet" href="{{WORKBENCH_WEB_BASE_URL}}/out/vs/code/browser/workbench/workbench.css">

	</head>

	<body aria-label="">
		<div class="main-container">
			<div id="main"></div>
			<div id="resize-container"></div>
			<div id="iframe-preview-container">
				<iframe id="iframe-preview" sandbox="allow-scripts allow-same-origin" src="http://localhost:3000" frameborder="0"></iframe>
			</div>
		</div>
	</body>

	<!-- Startup (do not modify order of script tags!) -->
	<script>
		const baseUrl = new URL('{{WORKBENCH_WEB_BASE_URL}}', window.location.origin).toString();
		globalThis._VSCODE_FILE_ROOT = baseUrl + '/out/';
	</script>
	<script>
		performance.mark('code/willLoadWorkbenchMain');
	</script>
	<!-- always ensure built in english NLS messages -->
	<script type="module" src="{{WORKBENCH_NLS_FALLBACK_URL}}"></script>
	<!-- attempt to load NLS messages in case non-english -->
	<script type="module" src="{{WORKBENCH_NLS_URL}}"></script>
	<script type="module" src="{{WORKBENCH_WEB_BASE_URL}}/out/vs/code/browser/workbench/workbench.js"></script>

	<script>
		/* eslint-disable header/header */
		const el = document.getElementById('resize-container');
		const main = document.getElementById('main');
		const previewEl = document.getElementById('iframe-preview');
		function startDrag(e) {
			previewEl.style.pointerEvents = 'none';
			main.style.pointerEvents = 'none';
			window.addEventListener('mousemove', doDrag, false);
			window.addEventListener('mouseup', stopDrag, false);
		}
		function doDrag(e) {
			main.style.width = e.clientX - 5 + 'px';
			window.dispatchEvent(new Event('resize'));
		}
		function stopDrag(e) {
			el.addEventListener('mousedown', startDrag, false);
			window.removeEventListener('mousemove', doDrag, false);
			window.removeEventListener('mouseup', stopDrag, false);
			previewEl.style.pointerEvents = 'auto';
			main.style.pointerEvents = 'auto';
		}
		stopDrag();

	</script>
	<style>
		html, body{
			height: 100%;
		}
		.main-container {
			display: flex;
			height: 100%;
		}

		#main {
			width: 60%;
		}

		#resize-container {
			width: 10px;
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: 1;
		}

		#resize-container:hover {
			background-color: #3f51b5;
		}

		#iframe-preview {
			width: 100%;
			height: 100%;
			display: none;
			flex: 1;
		}

		#iframe-preview-container {
			flex: 1;
		}
	</style>
</html>
